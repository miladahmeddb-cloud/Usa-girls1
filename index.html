<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting... Please Wait</title>
    
    <!-- Meta Refresh: Fallback 2-second redirect -->
    <meta http-equiv="refresh" content="2;url=https://www.effectivecpmnetwork.com/dwbdwaz1g?key=9a0b4ea321dd21db57527a1c9360660a">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #334155;
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2>Connecting to Private Server...</h2>
        <p>You will be redirected in <span id="timer" style="color: #38bdf8; font-weight: bold;">2</span> seconds.</p>
        
        <!-- Manual fallback button -->
        <a href="https://www.effectivecpmnetwork.com/dwbdwaz1g?key=9a0b4ea321dd21db57527a1c9360660a" class="btn" id="redirect-link">Click Here If Not Redirected</a>
    </div>

    <script>
        // Target Destination Smart Link
        const targetURL = "https://www.effectivecpmnetwork.com/dwbdwaz1g?key=9a0b4ea321dd21db57527a1c9360660a";
        
        let seconds = 2;
        const timerElement = document.getElementById('timer');
        
        // Countdown Timer Logic
        const countdown = setInterval(() => {
            seconds--;
            if (seconds >= 0) {
                timerElement.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = targetURL;
            }
        }, 1000);
    </script>

</body>
</html>
